[package]
name = "threei-dispatch-bench"
version = "0.1.0"
edition = "2021"
description = "Standalone microbenchmark for 3i syscall-dispatch / policy-enforcement design options"

[dependencies]
anyhow = "1"
dashmap = "6"
parking_lot = "0.12"
libc = "0.2"
wasmtime = "44"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
debug = 1

[[bin]]
name = "bench"
path = "src/main.rs"
